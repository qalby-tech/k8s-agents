name: engine-codex
on:
  push:
    branches: [main]
    paths:
      - "engines/codex/**"
      - "shared/**"
      - ".github/workflows/engine-codex.yml"
      - ".github/workflows/_docker.yml"
  workflow_dispatch:
jobs:
  image:
    uses: ./.github/workflows/_docker.yml
    secrets: inherit
    with:
      project: engines/codex
      prefix: codex
      context: .
      dockerfile: engines/codex/Dockerfile
